<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Lumen: when speed meets the light. A bright point of light racing forward, trailing speed lines. -->
  <defs>
    <radialGradient id="bg" cx="70%" cy="30%" r="90%">
      <stop offset="0" stop-color="#1b1f45"/>
      <stop offset="0.55" stop-color="#0b0d1f"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c5cff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#7fb4ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="trail2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#8fb8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g stroke-linecap="round" fill="none">
    <line x1="96"  y1="400" x2="352" y2="166" stroke="url(#trail)"  stroke-width="34"/>
    <line x1="150" y1="430" x2="330" y2="266" stroke="url(#trail2)" stroke-width="14"/>
    <line x1="70"  y1="320" x2="250" y2="156" stroke="url(#trail)"  stroke-width="12" opacity="0.8"/>
  </g>
  <circle cx="360" cy="158" r="120" fill="url(#glow)"/>
  <circle cx="360" cy="158" r="30" fill="#ffffff"/>
</svg>
